<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Translation Tool</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>🌐 Language Translator</h1>
            <p>Translate text quickly and easily</p>
        </header>

        <div class="translator">

            <!-- Input Section -->
            <div class="box">
                <div class="box-header">
                    <label for="sourceLanguage">From</label>

                    <select id="sourceLanguage">
                        <option value="auto">Auto Detect</option>
                        <option value="en">English</option>
                        <option value="hi">Hindi</option>
                        <option value="mr">Marathi</option>
                        <option value="gu">Gujarati</option>
                        <option value="bn">Bengali</option>
                        <option value="ta">Tamil</option>
                        <option value="te">Telugu</option>
                        <option value="kn">Kannada</option>
                        <option value="ml">Malayalam</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="es">Spanish</option>
                        <option value="it">Italian</option>
                        <option value="pt">Portuguese</option>
                        <option value="ru">Russian</option>
                        <option value="ja">Japanese</option>
                        <option value="ko">Korean</option>
                        <option value="zh">Chinese</option>
                    </select>
                </div>

                <textarea
                    id="inputText"
                    placeholder="Enter text to translate..."
                    maxlength="5000"></textarea>

                <div class="bottom-controls">
                    <span id="charCount">0 / 5000</span>

                    <button class="icon-btn" id="speakInput" title="Listen">
                        🔊
                    </button>
                </div>
            </div>

            <!-- Swap Button -->
            <button id="swapButton" class="swap-btn" title="Swap languages">
                ⇄
            </button>

            <!-- Output Section -->
            <div class="box">
                <div class="box-header">
                    <label for="targetLanguage">To</label>

                    <select id="targetLanguage">
                        <option value="hi">Hindi</option>
                        <option value="en">English</option>
                        <option value="mr">Marathi</option>
                        <option value="gu">Gujarati</option>
                        <option value="bn">Bengali</option>
                        <option value="ta">Tamil</option>
                        <option value="te">Telugu</option>
                        <option value="kn">Kannada</option>
                        <option value="ml">Malayalam</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="es">Spanish</option>
                        <option value="it">Italian</option>
                        <option value="pt">Portuguese</option>
                        <option value="ru">Russian</option>
                        <option value="ja">Japanese</option>
                        <option value="ko">Korean</option>
                        <option value="zh">Chinese</option>
                    </select>
                </div>

                <div id="outputText" class="output">
                    Translation will appear here...
                </div>

                <div class="bottom-controls">

                    <span id="translationStatus"></span>

                    <div>
                        <button class="icon-btn" id="copyButton" title="Copy">
                            📋
                        </button>

                        <button class="icon-btn" id="speakOutput" title="Listen">
                            🔊
                        </button>
                    </div>

                </div>
            </div>

        </div>

        <button id="translateButton" class="translate-btn">
            Translate
        </button>

        <p id="errorMessage" class="error"></p>

        <footer>
            <p>Language Translation Tool | HTML • CSS • JavaScript</p>
        </footer>

    </div>

    <script src="script.js?v=2"></script>

</body>
</html>
